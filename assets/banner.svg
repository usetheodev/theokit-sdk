<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="TheoKit SDK — the open-source agent runtime for TypeScript" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F04148"/>
      <stop offset="1" stop-color="#DE2329"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.14" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#DE2329" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#DE2329" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="16" fill="none" stroke="#2A2F45" stroke-width="1"/>

  <image x="74" y="66" width="168" height="168" href="data:image/png;base64,"/>

  <rect x="286" y="96" width="6" height="108" rx="3" fill="url(#accent)"/>

  <text x="316" y="140" font-size="58" font-weight="800" fill="#FFFFFF">TheoKit <tspan fill="#F8A0A4">SDK</tspan></text>
  <text x="318" y="182" font-size="24" font-weight="500" fill="#AAB2C5">The open-source agent runtime for TypeScript.</text>
  <text x="318" y="228" font-size="16" font-weight="600" letter-spacing="1" fill="#7C8398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Agent.create  ·  prompt  ·  stream  ·  resume</text>
  <text x="318" y="262" font-size="13" font-weight="500" fill="#8B93A7">43 LLM providers · MCP · subagents · cron · local-first · Apache-2.0</text>

  <g transform="translate(1030,150)">
    <circle r="70" fill="none" stroke="#DE2329" stroke-opacity="0.42" stroke-width="1.6" stroke-dasharray="318 22" transform="rotate(-104)"/>
    <polygon points="-9,-78 7,-70 -9,-62" fill="url(#accent)"/>
    <circle cx="70" cy="0" r="8" fill="url(#accent)"/>
    <circle cx="0" cy="70" r="8" fill="url(#accent)"/>
    <circle cx="-70" cy="0" r="8" fill="url(#accent)"/>
  </g>
</svg>
