<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="TheoKit SDK — the open-source agent runtime for TypeScript" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F04148"/>
      <stop offset="1" stop-color="#DE2329"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#DE2329" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#DE2329" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <image x="118" y="96" width="216" height="216" href="data:image/png;base64,"/>

  <text x="118" y="400" font-size="80" font-weight="800" fill="#FFFFFF">TheoKit <tspan fill="#F8A0A4">SDK</tspan></text>
  <rect x="118" y="428" width="96" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="118" y="486" font-size="34" font-weight="500" fill="#AAB2C5">The open-source agent runtime for TypeScript.</text>
  <text x="118" y="536" font-size="22" font-weight="600" letter-spacing="1" fill="#7C8398" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">Agent.create  ·  prompt  ·  stream  ·  resume</text>
  <text x="118" y="578" font-size="19" font-weight="500" fill="#8B93A7">43 LLM providers · MCP · subagents · cron · local-first · Apache-2.0</text>

  <g transform="translate(1010,240)">
    <circle r="128" fill="none" stroke="#DE2329" stroke-opacity="0.38" stroke-width="2.4" stroke-dasharray="580 44" transform="rotate(-102)"/>
    <polygon points="-15,-142 12,-128 -15,-114" fill="url(#accent)"/>
    <circle cx="128" cy="0" r="13" fill="url(#accent)"/>
    <circle cx="0" cy="128" r="13" fill="url(#accent)"/>
    <circle cx="-128" cy="0" r="13" fill="url(#accent)"/>
  </g>
</svg>
