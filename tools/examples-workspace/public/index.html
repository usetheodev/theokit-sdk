<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>theokit-sdk — examples workspace</title>
<style>
  :root {
    --bg: #0e1116; --panel: #151a21; --panel-2: #1a212b; --border: #262f3d;
    --text: #d7dee8; --muted: #8494a8; --accent: #5aa9ff; --green: #4ec97a;
    --red: #ff6b6b; --yellow: #e5c07b; --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .providers { display: flex; gap: 10px; margin-left: auto; font-size: 12px; color: var(--muted); }
  .providers b { font-weight: 500; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; background: var(--red); }
  .dot.on { background: var(--green); }
  main { display: flex; flex: 1; min-height: 0; }
  /* sidebar */
  aside { width: 300px; min-width: 300px; border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; }
  aside input { margin: 10px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); outline: none; }
  aside input:focus { border-color: var(--accent); }
  nav { overflow-y: auto; flex: 1; padding-bottom: 12px; }
  .domain { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 12px 14px 4px; }
  .item { padding: 7px 14px; cursor: pointer; border-left: 2px solid transparent; }
  .item:hover { background: var(--panel-2); }
  .item.active { background: var(--panel-2); border-left-color: var(--accent); }
  .item .t { font-weight: 500; }
  .item .s { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--border); color: var(--muted); }
  .badge.docs { color: var(--accent); border-color: var(--accent); }
  .badge.run-on { color: var(--green); border-color: var(--green); }
  /* content */
  section { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .head { padding: 12px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .head .info { min-width: 0; }
  .head h2 { margin: 0; font-size: 16px; }
  .head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  button { font: inherit; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #runBtn { background: #143a24; border-color: var(--green); color: var(--green); font-weight: 600; }
  #stopBtn { background: #3a1414; border-color: var(--red); color: var(--red); }
  .status { font-size: 12px; color: var(--muted); }
  .panes { flex: 1; display: flex; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--border); }
  .tabs { display: flex; gap: 2px; padding: 6px 10px 0; border-bottom: 1px solid var(--border); background: var(--panel); }
  .tabs button { border: none; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px 6px 0 0; }
  .tabs button.active { color: var(--text); background: var(--panel-2); }
  .tabs .label { margin-left: auto; align-self: center; font-size: 11px; color: var(--muted); padding-right: 6px; }
  pre { margin: 0; flex: 1; overflow: auto; padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
  #code .kw { color: #c678dd; } #code .str { color: #98c379; } #code .com { color: #5c6b7f; font-style: italic; } #code .num { color: #d19a66; }
  #out { background: #0a0d11; }
  #out .stderr { color: var(--red); }
  #out .phase { color: var(--yellow); }
  #out .exit-ok { color: var(--green); font-weight: 600; }
  #out .exit-bad { color: var(--red); font-weight: 600; }
  .empty { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><span>@theokit/sdk</span> · examples workspace</h1>
  <div class="providers" id="providers"></div>
</header>
<main>
  <aside>
    <input id="search" type="search" placeholder="Filtrar examples…" autocomplete="off" />
    <nav id="list"></nav>
  </aside>
  <section>
    <div class="head" id="head" hidden>
      <div class="info">
        <h2 id="title"></h2>
        <p id="desc"></p>
      </div>
      <div class="actions">
        <span class="status" id="status"></span>
        <button id="runBtn">▶ Executar</button>
        <button id="stopBtn" hidden>■ Parar</button>
      </div>
    </div>
    <div class="empty" id="empty">Selecione um example na lista para ver o código e executar.</div>
    <div class="panes" id="panes" hidden>
      <div class="pane">
        <div class="tabs">
          <button id="tabCode" class="active">run.ts</button>
          <button id="tabReadme">README</button>
          <span class="label">código</span>
        </div>
        <pre id="code"></pre>
      </div>
      <div class="pane">
        <div class="tabs"><button class="active" disabled>saída</button><span class="label" id="outLabel">provider real</span></div>
        <pre id="out"></pre>
      </div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let state = { examples: [], providers: {}, running: [] };
let selected = null;
let files = { code: null, readme: null };
let activeTab = "code";
let runController = null;

const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function highlight(source) {
  const kw = /\b(import|export|from|const|let|var|function|class|new|return|await|async|if|else|for|of|in|try|catch|finally|throw|typeof|undefined|null|true|false|default|extends|static|private)\b/g;
  return esc(source)
    .replace(/(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(\d[\d_.]*)\b/g,
      (m, com, str, num) => {
        if (com) return `<span class="com">${com}</span>`;
        if (str) return `<span class="str">${str}</span>`;
        if (num) return `<span class="num">${num}</span>`;
        return m;
      })
    .replace(kw, '<span class="kw">$1</span>');
}

function renderProviders() {
  $("providers").innerHTML = Object.entries(state.providers)
    .map(([key, on]) => `<span><i class="dot ${on ? "on" : ""}"></i><b>${esc(key)}</b></span>`)
    .join("");
}

function renderList() {
  const query = $("search").value.trim().toLowerCase();
  const visible = state.examples.filter((e) =>
    query === "" || e.slug.includes(query) || e.title.toLowerCase().includes(query) || e.domain.includes(query));
  const groups = new Map();
  for (const e of visible) {
    if (!groups.has(e.domain)) groups.set(e.domain, []);
    groups.get(e.domain).push(e);
  }
  let html = "";
  for (const [domain, items] of groups) {
    html += `<div class="domain">${esc(domain)}</div>`;
    for (const e of items) {
      const runningNow = state.running.includes(e.slug);
      html += `<div class="item ${selected === e.slug ? "active" : ""}" data-slug="${e.slug}">
        <div class="t">${esc(e.title)}</div>
        <div class="s">${esc(e.slug)}
          ${e.inManifest ? '<span class="badge docs">docs</span>' : ""}
          ${runningNow ? '<span class="badge run-on">rodando</span>' : ""}
          ${e.installed ? "" : '<span class="badge">sem deps</span>'}
          ${e.runnable ? "" : '<span class="badge">sem run.ts</span>'}
        </div></div>`;
    }
  }
  $("list").innerHTML = html || '<div class="domain">nenhum resultado</div>';
}

function renderTabs() {
  $("tabCode").classList.toggle("active", activeTab === "code");
  $("tabReadme").classList.toggle("active", activeTab === "readme");
  const pre = $("code");
  if (activeTab === "code") pre.innerHTML = files.code === null ? "(sem run.ts)" : highlight(files.code);
  else pre.textContent = files.readme === null ? "(sem README)" : files.readme;
}

async function select(slug) {
  selected = slug;
  const example = state.examples.find((e) => e.slug === slug);
  $("head").hidden = false; $("panes").hidden = false; $("empty").hidden = true;
  $("title").textContent = example.title;
  $("desc").textContent = example.description || example.slug;
  $("runBtn").disabled = !example.runnable || runController !== null;
  $("status").textContent = example.runnable ? "" : "sem run.ts — rode manualmente";
  renderList();
  const response = await fetch(`/api/examples/${slug}/files`);
  files = response.ok ? await response.json() : { code: null, readme: null };
  renderTabs();
}

function appendOut(text, cls) {
  const out = $("out");
  const stick = out.scrollTop + out.clientHeight >= out.scrollHeight - 8;
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  if (stick) out.scrollTop = out.scrollHeight;
}

async function run() {
  const slug = selected;
  $("out").textContent = "";
  $("runBtn").disabled = true; $("stopBtn").hidden = false;
  $("status").textContent = "executando…";
  runController = new AbortController();
  try {
    const response = await fetch(`/api/examples/${slug}/run`, { method: "POST", signal: runController.signal });
    if (!response.ok) {
      appendOut((await response.json()).error + "\n", "stderr");
      return;
    }
    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();
      for (const line of lines) {
        if (line.trim() === "") continue;
        const event = JSON.parse(line);
        if (event.type === "phase") appendOut(`\n── ${event.phase}: ${event.command} ──\n`, "phase");
        else if (event.type === "stdout") appendOut(event.data);
        else if (event.type === "stderr") appendOut(event.data, "stderr");
        else if (event.type === "error") appendOut(`\nerro: ${event.message}\n`, "stderr");
        else if (event.type === "exit") {
          const ok = event.code === 0;
          appendOut(`\n${ok ? "✔" : "✘"} ${event.phase} finalizou — exit ${event.code ?? event.signal} em ${(event.durationMs / 1000).toFixed(1)}s\n`, ok ? "exit-ok" : "exit-bad");
          $("status").textContent = ok ? "sucesso" : "falhou";
        }
      }
    }
  } catch (error) {
    if (error.name !== "AbortError") appendOut(`\nfalha de conexão: ${error.message}\n`, "stderr");
  } finally {
    runController = null;
    $("runBtn").disabled = false; $("stopBtn").hidden = true;
    refreshState();
  }
}

async function stop() {
  if (selected !== null) await fetch(`/api/examples/${selected}/stop`, { method: "POST" }).catch(() => {});
  if (runController !== null) runController.abort();
}

async function refreshState() {
  const response = await fetch("/api/state");
  state = await response.json();
  renderProviders();
  renderList();
}

$("list").addEventListener("click", (event) => {
  const item = event.target.closest(".item");
  if (item !== null) select(item.dataset.slug);
});
$("search").addEventListener("input", renderList);
$("tabCode").addEventListener("click", () => { activeTab = "code"; renderTabs(); });
$("tabReadme").addEventListener("click", () => { activeTab = "readme"; renderTabs(); });
$("runBtn").addEventListener("click", run);
$("stopBtn").addEventListener("click", stop);

refreshState();
</script>
</body>
</html>
