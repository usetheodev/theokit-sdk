name: examples

# Runs every docs example against a REAL LLM to catch breakage before it reaches
# the docs / the hosted runner. This is affordable because the examples use a FREE
# tool-calling model (openai/gpt-oss-120b:free) — a full matrix costs $0.
#
# Requires the repo/org secret OPENROUTER_API_KEY (any key works; the model is free).
# Without it, the job is skipped (so forks/untrusted PRs don't hard-fail).

on:
  push:
    paths:
      - "examples/**"
      - ".github/workflows/examples.yml"
  pull_request:
    paths:
      - "examples/**"
  schedule:
    - cron: "0 6 * * *" # nightly — catch free-model availability drift
  workflow_dispatch:

jobs:
  run-examples:
    name: run examples (real LLM, free model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build SDK (examples run against dist)
        run: pnpm build

      - name: Guard — OPENROUTER_API_KEY present
        id: guard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY not set — skipping live example runs."
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run every example from the manifest
        if: steps.guard.outputs.have_key == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          slugs=$(node -e "console.log(require('./examples/manifest.json').examples.map(e=>e.slug).join(' '))")
          fail=0
          for slug in $slugs; do
            echo "::group::$slug"
            if (cd "examples/$slug" && pnpm exec tsx run.ts); then
              echo "PASS $slug"
            else
              echo "::error title=example failed::$slug did not run cleanly"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
