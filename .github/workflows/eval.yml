name: eval

# Runs the SE41 eval suites (tests/eval/suites/**) against a REAL LLM to gate
# agent-quality regressions. The DETERMINISTIC suite already runs on every
# `pnpm test` in ci.yml (zero tokens); THIS workflow adds the OpenRouter-gated
# suites (assertEval thresholds fail the job on regression).
#
# Requires the repo/org secret OPENROUTER_API_KEY (the QA set uses a cheap
# model). Without it, the run is skipped so forks/untrusted PRs never hard-fail.

on:
  push:
    # Without a branches filter this fired on a push to ANY branch touching these
    # paths, spending real LLM budget on work-in-progress that no one was reading
    # the result of. The integration branches are where an eval regression has to
    # be caught; a workspace push can still request one with workflow_dispatch.
    branches: [main, develop]
    paths:
      - "packages/sdk/src/eval.ts"
      - "packages/sdk/src/scorers.ts"
      - "packages/sdk/src/internal/eval/**"
      - "packages/sdk/src/internal/scorers/**"
      - "packages/sdk/tests/eval/suites/**"
      - ".github/workflows/eval.yml"
  schedule:
    - cron: "0 7 * * 1" # weekly — Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Every run costs tokens against a real provider, so two runs of the same ref are
# never both worth paying for.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-evals:
    name: run eval suites (real LLM)
    runs-on: ubuntu-latest
    # A hung provider call must not hold a runner — and must not keep billing —
    # for GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable Corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          # The cache key must change when the package manager does. setup-node keys the
          # pnpm store on the lockfile alone, so a pnpm 9 -> 10 bump leaves the key
          # identical and the job restores a store the new pnpm reads as inconsistent —
          # `ERR_PNPM_MISSING_PACKAGE_INDEX_FILE`, on a package the lockfile does list.
          # package.json carries `packageManager`, so including it ties the cache to the
          # pnpm that wrote it.
          cache-dependency-path: |
            pnpm-lock.yaml
            package.json

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"

      - name: Guard — OPENROUTER_API_KEY present
        id: guard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY not set — skipping real-LLM eval suites."
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run eval suites (assertEval gates)
        if: steps.guard.outputs.have_key == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm eval
