name: eval

# Runs the SE41 eval suites (tests/eval/suites/**) against a REAL LLM to gate
# agent-quality regressions. The DETERMINISTIC suite already runs on every
# `pnpm test` in ci.yml (zero tokens); THIS workflow adds the OpenRouter-gated
# suites (assertEval thresholds fail the job on regression).
#
# Requires the repo/org secret OPENROUTER_API_KEY (the QA set uses a cheap
# model). Without it, the run is skipped so forks/untrusted PRs never hard-fail.

on:
  push:
    paths:
      - "packages/sdk/src/eval.ts"
      - "packages/sdk/src/scorers.ts"
      - "packages/sdk/src/internal/eval/**"
      - "packages/sdk/src/internal/scorers/**"
      - "packages/sdk/tests/eval/suites/**"
      - ".github/workflows/eval.yml"
  schedule:
    - cron: "0 7 * * 1" # weekly — Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-evals:
    name: run eval suites (real LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"

      - name: Guard — OPENROUTER_API_KEY present
        id: guard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::warning::OPENROUTER_API_KEY not set — skipping real-LLM eval suites."
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run eval suites (assertEval gates)
        if: steps.guard.outputs.have_key == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm eval
