name: docs-drift

# v1 SOFT gate (ADR D14) — emits a warning + PR comment when docs.md / dist /
# examples drift from theo-opendocs/. Does NOT block merge. Hard gate in v1.1
# (4 weeks of stable operation).

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/sdk/docs.md'
      - 'packages/sdk/src/**'
      - 'examples/**'

jobs:
  drift-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout theokit-sdk
        uses: actions/checkout@v4
        with:
          path: theokit-sdk

      - name: Checkout theo-opendocs (sibling)
        uses: actions/checkout@v4
        with:
          repository: usetheodev/theo-opendocs
          path: theo-opendocs
          token: ${{ secrets.THEO_OPENDOCS_PAT }}
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install + build SDK
        working-directory: theokit-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @theokit/sdk run build
          pnpm --filter @theokit/sdk run docs:json

      - name: Run drift check
        id: drift
        working-directory: theokit-sdk/packages/sdk
        run: pnpm docs:drift 2>&1 | tee /tmp/drift-report.txt
        continue-on-error: true

      - name: Comment PR on drift
        if: steps.drift.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/drift-report.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Docs drift detected (soft gate)\n\n```\n' + body.slice(0, 6000) + '\n```\n\n_v1 is warning-only. v1.1 will block merge._',
            });
