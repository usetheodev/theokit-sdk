name: Release

# Per technical-hardening-sprint plan v1.1 T1.1 (NEW) + ADR D1:
# theokit-sdk ships the Harness package set (sdk + sdk-* extensions + memory
# adapters + acp + cli + codemod) — changesets/action pattern is the right
# vehicle for multi-package per-package release notes + sequential publish.
# (Backend-DX, gateways, react, rag, voice, google-workspace skill were
# extracted to sibling repos — plan monorepo-cohesion-split, 2026-06-18.)
# OIDC trusted-publisher binding (per-package config at npmjs.com) attests
# provenance automatically. NPM_TOKEN intentionally NOT used — per EC-2
# absorbed, token env disables OIDC silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release via Changesets (Harness)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth via granular npm automation token (NODE_AUTH_TOKEN; setup-node wired
          # the registry .npmrc to read it). Token-auth path — the tokenless OIDC
          # trusted-publisher binding is not yet configured for the @theokit/* packages.
          # PROVENANCE IS DISABLED: npm refuses provenance attestation for PRIVATE source
          # repositories (E422 "Unsupported GitHub Actions source repository visibility:
          # private"). This repo is currently private, and the already-published versions
          # have no attestation either — so provenance:true was aspirational and never
          # worked. `provenance` was removed from each package's publishConfig too.
          # Migration path: when the repo goes public (Apache-2.0 open SDK), re-add
          # NPM_CONFIG_PROVENANCE + publishConfig.provenance and configure trusted
          # publishers at npmjs.com/package/<pkg>/settings to go fully tokenless+attested.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
