name: Release

# Per technical-hardening-sprint plan v1.1 T1.1 (NEW) + ADR D1:
# theokit-sdk ships 22 packages — changesets/action pattern is the right
# vehicle for multi-package per-package release notes + sequential publish.
# OIDC trusted-publisher binding (per-package config at npmjs.com) attests
# provenance automatically. NPM_TOKEN intentionally NOT used — per EC-2
# absorbed, token env disables OIDC silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release via Changesets (22 packages)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auth via granular npm automation token (NODE_AUTH_TOKEN; setup-node wired
          # the registry .npmrc to read it). This is the token-auth path — NOT the
          # tokenless OIDC trusted-publisher binding. We use it because the dashboard
          # trusted-publisher binding is not yet configured for the @theokit/* packages
          # (an OIDC publish returned E404 — no trusted-publisher authorizes this repo).
          # PROVENANCE IS PRESERVED: id-token: write + NPM_CONFIG_PROVENANCE: true still
          # generate a signed sigstore attestation regardless of the auth mechanism.
          # Migration path: configure trusted publishers at npmjs.com/package/<pkg>/settings
          # for all packages, then drop NODE_AUTH_TOKEN to go fully tokenless.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
