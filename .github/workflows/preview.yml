name: Preview releases

# Every fix in this repository used to be unverifiable by a consumer until the next
# release cut. theokit-examples installs every example from npm at a pinned version,
# deliberately — an example that resolves through a workspace tests the repository it
# lives in, not the experience of the person who typed `npm install`. So "does this fix
# work for a consumer?" could not be answered before publishing.
#
# There are now two answers, and they are for different questions:
#
#   THIS workflow      — a preview per commit, on pkg.pr.new's own registry, never npm.
#                        Costs nothing, burns no version, exists for iteration.
#   release.yml's      — a snapshot on the real registry under a non-`latest` dist-tag.
#   snapshot path        Burns an immutable npm version. For the artifact npm actually
#                        serves, when that is the question.
#
# Reach for this one first. Reach for the snapshot when the answer has to come from
# registry.npmjs.org specifically.
#
# Requires the `pkg-pr-new` GitHub App on the organisation — it is what posts the pull
# request comment. Without it the publish still runs and the comment never appears, which
# looks like the tool being broken rather than uninstalled. Installed on usetheokit
# 2026-08-31.

on:
  # Filtered by BASE branch, and that is the only lever there is: `pull_request` has no head-branch
  # filter, and a job-level `if:` cannot help — GitHub decides whether a run needs approval BEFORE
  # any job is evaluated, so the run is created, held, and expires regardless.
  #
  # A back-merge is `main -> workspace`, so excluding `workspace` as a base removes exactly the
  # pull requests that expire. It is opened by `github-actions[bot]`, whose runs GitHub holds for
  # manual approval; nobody approves them, and each lands in the checks list as a failure meaning
  # "a preview nobody needed was not produced".
  #
  # THE COST, stated rather than discovered: a Dependabot pull request also targets `workspace`, so
  # it no longer previews before merge. The `push` trigger below still previews the moment it lands,
  # which is a few minutes later and the same packages.
  pull_request:
    branches: [develop, main]
  push:
    # Work is born on `workspace` and only meets a pull request at promotion time, so a
    # fix would otherwise sit here with no preview during the window it is most worth
    # iterating on. A push with no pull request gets a `@workspace` tag rather than a
    # comment, which is exactly the addressable thing wanted.
    branches: [workspace]

# pkg.pr.new authenticates as its own GitHub App and comments as itself. It needs nothing
# from GITHUB_TOKEN, so this job holds nothing.
permissions: {}

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # The implementation moved to shared-workflows on 2026-09-01. It was the only copy in an
    # ecosystem of nine publishable repositories, which is why only this repository's pull requests
    # carried the pkg.pr.new comment.
    #
    # The two inputs keep what was stricter here. `packages-command` reuses this repository's own
    # `publishablePackages()` — the same enumeration the workspace-protocol guard uses, so
    # "publishable" cannot mean two things. `publish-command` resolves pkg-pr-new from the lockfile,
    # which is the tool's own CI guidance and stricter than the shared default's pinned `dlx`.
    uses: usetheokit/shared-workflows/.github/workflows/preview.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      packages-command: node tools/list-publishable-packages.mjs
      # Pinned to the version this repository resolved from its lockfile before the workflow moved
      # to shared-workflows. `pnpm exec` is no longer used, so the devDependency went with it —
      # knip reported it unused and was right: a `with:` block is not a reference knip can see, so
      # keeping the dependency would have meant keeping a lie in the manifest to satisfy a comment.
      # An exact `dlx` pin does not float either, which is what the lockfile was buying.
      pkg-pr-new-version: '0.0.88'
