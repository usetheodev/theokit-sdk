name: CI

on:
  push:
    branches: [main, develop, feat/**]
  # Both promotion legs of the flow are PRs — workspace -> develop and
  # develop -> main — so both bases must be listed here. Until 2026-08-17 only
  # `main` was, which left the workspace -> develop PR with no CI at all: the
  # leg every change passes through was gated solely by the local pre-push hook,
  # which proves the author ran the gates on their machine, not that the merge
  # result is green, and which `--no-verify` skips.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    name: validate (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.12', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm check

      - name: Build
        # Build SDK first so packages/react typecheck can resolve
        # `@theokit/sdk` types from `packages/sdk/dist/index.d.ts`.
        # Mirrors the `pnpm validate` script order in package.json.
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # dogfood-regressions-fix-plan v1.1 T4.2 — defense in depth against
      # NODE_MODULE_VERSION mismatch (better-sqlite3 ABI). The preflight
      # auto-runs in vitest setup (T1.1), but CI=true makes it fail-fast
      # WITHOUT attempting rebuild — so we rebuild explicitly here.
      # The `|| true` is intentional: if rebuild fails (runner missing
      # build-essential), preflight surfaces the actionable error at test
      # time. We never silently swallow the test failure downstream.
      - name: Rebuild native bindings (better-sqlite3 ABI guard)
        run: pnpm rebuild better-sqlite3 || echo "::warning::native rebuild failed — preflight will surface details at test time"

      # M75 — os 10 itLive de tests/linux-sandbox-integration.test.ts provam confinamento REAL de
      # kernel (blocks writes outside the workspace, blocks network, seccomp blocks ptrace and AF_INET).
      # Without bwrap they SKIP, and a skipped test is reported green: the M75 review proved by mutation
      # that, without this step, swapping buildSeccompFilter for a filter denying NOTHING passed.
      #
      # `apt install` alone is not enough: Ubuntu 24.04 blocks unprivileged user namespaces via
      # AppArmor and the active detection fails. The smoke test at the end FAILS the step if userns stays blocked —
      # without it we would be back to empty green.
      - name: Install bubblewrap + enable unprivileged userns (kernel-confinement tests)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-net --ro-bind / / /bin/true && echo "bwrap OK: userns liberado"

      - name: Tests
        run: pnpm test

      - name: Publint
        run: pnpm validate:publint

      - name: ATTW (types resolve)
        run: pnpm validate:attw

      - name: Quality (dead code, cycles, LoC, duplication)
        run: pnpm quality

      # SDK 2.0 split — Phase 10 / T10.1 / ADR D9. Locks in extraction
      # bundle gains: any package whose dist/index.js gzipped exceeds
      # the declared budget at .bundle-budget.json fails CI before merge.
      - name: Bundle budget gate
        run: pnpm check:bundle

  no-reconsumed-changesets:
    # B-109 — refuse a release PR that would re-release work already shipped.
    #
    # `changesets/action` consumes the `.changeset/*.md` files in a "Version Packages" PR into
    # `main`, and nothing carries that back to `develop`. On 2026-08-11 the drift reached 10 commits
    # and three already-released changesets; merging `develop → main` in that state would have
    # re-published three shipped features as fresh minors. It was avoided only because someone
    # looked. This job is what looks.
    #
    # Separate from `validate` on purpose: it needs no install and no build, so it answers in
    # seconds and its failure names one cause instead of arriving inside a ten-minute matrix.
    name: no re-consumed changesets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The check asks git whether the BASE has ever deleted a path. A shallow clone has no
          # such history and would answer "no" for everything — a silent pass, which for a guard is
          # worse than an error.
          fetch-depth: 0

      - name: Check that no changeset on this branch was already consumed by the base
        run: |
          node scripts/check-no-reconsumed-changesets.mjs \
            "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"
