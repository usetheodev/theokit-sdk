# SonarQube Cloud analysis scope, generated from this repository's real layout.
#
# Source roots are stated explicitly rather than discovered. Left to discovery the scanner
# also reads build output and reports duplication between a source file and its own bundle
# — measured on theokit-tui (B-126).

sonar.projectKey=usetheokit_theokit-sdk
sonar.organization=usetheokit

sonar.sources=packages/acp/src,packages/cli/src,packages/memory-honcho/src,packages/memory-mem0/src,packages/memory-supermemory/src,packages/sdk-budget/src,packages/sdk-cache/src,packages/sdk-handoff/src,packages/sdk-memory/src,packages/sdk-pty/src,packages/sdk-tools/src,packages/sdk/src
sonar.tests=packages/acp/tests,packages/cli/tests,packages/memory-honcho/tests,packages/memory-mem0/tests,packages/memory-supermemory/tests,packages/sdk-budget/tests,packages/sdk-cache/tests,packages/sdk-handoff/tests,packages/sdk-memory/tests,packages/sdk-peer-integration-tests/tests,packages/sdk-pty/tests,packages/sdk-tools/tests,packages/sdk/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.d.ts,**/*.stories.tsx,wiki/**

# Written by the coverage run. A path listed here that the build never writes reports
# 0% while the suite is green, and that number is indistinguishable from a measured one.
sonar.javascript.lcov.reportPaths=e2e/coverage/lcov.info,packages/acp/coverage/lcov.info,packages/cli/coverage/lcov.info,packages/memory-honcho/coverage/lcov.info,packages/memory-mem0/coverage/lcov.info,packages/memory-supermemory/coverage/lcov.info,packages/sdk-budget/coverage/lcov.info,packages/sdk-cache/coverage/lcov.info,packages/sdk-handoff/coverage/lcov.info,packages/sdk-memory/coverage/lcov.info,packages/sdk-peer-integration-tests/coverage/lcov.info,packages/sdk-pty/coverage/lcov.info,packages/sdk-tools/coverage/lcov.info,packages/sdk/coverage/lcov.info,tools/coverage/lcov.info

sonar.sourceEncoding=UTF-8
