findings:
  - id: F-wire-1
    severity: MEDIUM
    file: packages/sdk/src/internal/session/index.ts
    line: 1
    plan_ref: T4.1 — Promote session to internal/session with its own barrel (DoD#1)
    summary: >
      The new session barrel (internal/session/index.ts) is ORPHAN — it has zero
      importers anywhere in the source tree. Every session consumer imports the
      moved files via deep relative paths (e.g. "../session/agent-session.js",
      "../../session/agent-session.js"), never through the barrel. The barrel is
      not re-exported from the public index.ts either.
    evidence: |
      grep -rn "session/index" packages/sdk/src --include="*.ts"  => 0 hits
      grep -rn "internal/session\"" packages/sdk/src --include="*.ts" => 0 hits
      All 9 session consumers use deep paths, e.g.:
        internal/agent-loop/loop-types.ts:8  import ... from "../session/agent-session.js"
        internal/runtime/lifecycle/post-run-lifecycle.ts:11 ... "../../session/agent-session.js"
        internal/local-agent/local-agent.ts:48 ... "../session/agent-session.js"
      Contrast: cloud-agent/index.ts AND local-agent/index.ts are both imported by
      agent-helpers.ts (lines 5 and 14) — those two barrels are genuinely consumed.
      knip did NOT catch this: root knip.json ignores "src/internal/**" for
      packages/sdk, so the orphan internal barrel is invisible to the dead-code gate.
    recommended_action: >
      Either (a) route the intra-runtime session importers through the barrel
      (import from "../session/index.js") so the barrel earns its keep and matches
      the T4.1 "route intra-runtime importers through the new barrel" REFACTOR step,
      OR (b) delete internal/session/index.ts since the plan's DoD#1 goal (shrink
      internal/runtime blast radius) is met by the file move alone and the barrel
      adds nothing if nobody imports it. Do not leave it as an orphan — it is dead
      code that only escaped knip because internal/** is ignored. Note cloud-agent
      and local-agent barrels are correctly wired via agent-helpers; only session
      diverged (its REFACTOR step to route consumers through the barrel was not done).

