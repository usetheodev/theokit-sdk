      devDeps. Only THREE were relocated (git status R); the fourth,
      sdk-memory-peer-loader.test.ts, was DELETED (git status D) rather than moved.
      This drops the loader's happy-path regression coverage — the exact BYO-memory
      peer-loading net EC-2 was written to protect.
    evidence: |
      git diff 3ea9e53b..HEAD --name-status:
        R094 .../memory-class-peer-routing.test.ts -> sdk-peer-integration-tests/...
        R093 .../migrate-peer-routing.test.ts      -> sdk-peer-integration-tests/...
        R083 .../peer-parity.test.ts               -> sdk-peer-integration-tests/...
        D    packages/sdk/tests/internal/memory/sdk-memory-peer-loader.test.ts   <-- DELETED, not moved
      Deleted test covered 5 loader behaviors now unexercised:
        test_loads_workspace_sdk_memory_when_present   (happy path — loads real peer)
        test_memoizes_repeated_calls_for_same_attempt
        test_loaded_module_satisfies_required_surfaces
        test_resetForTests_clears_memo_so_re_probe_is_possible
        test_loader_return_type_is_SdkMemoryModule_or_null
      The remaining packages/sdk/tests/peer-fallback-branch.test.ts only exercises
      the FORCED-ABSENT / fallback (negative) branch of the loader — not the
      positive "loads workspace peer when present" path. Production loader source
