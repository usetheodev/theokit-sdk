      The EC-2 numeric gate ("≥ 4 passing tests") is technically met (13 tests pass
      across the 3 relocated files), so the shape check did not flag the missing
      file — but the semantic intent (all 4 suites relocated) was violated.
    recommended_action: >
      Restore sdk-memory-peer-loader.test.ts into
      packages/sdk-peer-integration-tests/tests/ (it needs the real @theokit/sdk-memory
      devDep, which the new package already declares). If the deletion was intentional
