    plan_ref: D434 / T4.3 (DoD#1 blast-radius reduction)
    summary: >
      The runtime split is a relocation, not a decoupling — `internal/local-agent`
      and `internal/runtime` remain bidirectionally coupled. `internal/runtime/lifecycle/fork-agent.ts:21`
      imports VALUE `isCodePlugin` from `internal/local-agent/local-agent-plugins.js`
      while `internal/local-agent/local-agent-runtime-extensions.ts:18,113` and
      `local-agent.ts:513` import `ForkOptions/ForkResult/forkAgentImpl` back from
      `internal/runtime/lifecycle/fork-agent.js`. The audit's HIGH (blast radius) is
      not structurally reduced — the same edges now cross a directory boundary instead
      of living inside one package.
    evidence: |
      ```
      runtime/lifecycle/fork-agent.ts:21:   import { isCodePlugin } from "../../local-agent/local-agent-plugins.js";
      local-agent/local-agent-runtime-extensions.ts:18: import type { ForkOptions, ForkResult } from "../runtime/lifecycle/fork-agent.js";
      local-agent/local-agent-runtime-extensions.ts:113:  const { forkAgentImpl } = await import("../runtime/lifecycle/fork-agent.js");
      local-agent/local-agent.ts:513:  fork(options: import("../runtime/lifecycle/fork-agent.js").ForkOptions)...
      ```
    recommended_action: >
      Non-blocking for SE43 (goal was byte-stable relocation, achieved). But file a
      follow-up (SE44+): the `fork-agent ↔ local-agent` value edge is the true
      coupling to break — invert it via a port (e.g. move `isCodePlugin` to a
      neutral `internal/plugins/*` leaf both sides depend on downward), so
      `runtime/lifecycle` stops depending UP into `local-agent`. Record the residual
      coupling honestly in the CHANGELOG/ADR rather than implying the blast radius
      shrank when only the file location changed.
