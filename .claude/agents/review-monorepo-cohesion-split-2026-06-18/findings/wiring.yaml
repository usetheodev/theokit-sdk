  evidence: |
    theokit-backend-dx:               31 commits | di, di-agent, orm
    theokit-gateways:                 24 commits | gateway + 10 adapters (11 pkgs)
    theokit-react:                    14 commits | react
    theokit-rag:                       4 commits | flat single-package (was @theokit/sdk/rag)
    theokit-voice:                     5 commits | flat single-package (was embedded)
    theokit-skills-google-workspace:   9 commits | skills-google-workspace
