findings:
  - id: F-tests-1
    severity: MEDIUM
    file: .claude/knowledge-base/reviews/monorepo-cohesion-split-implement-validate-2026-06-18.md
    line: 23
    plan_ref: "Final Phase — pre-existing flakiness logging contract"
    summary: >
      The validate report's stated ROOT CAUSE for the parallel-run flakiness is
      factually wrong. It claims "the vitest-4 migration removed poolOptions,
      weakening the singleFork isolation CLAUDE.md documents." But
      packages/sdk/vitest.config.ts STILL HAS poolOptions present, and it is set
      to `singleFork: false` with `maxForks: 4` — i.e. the SDK suite
      INTENTIONALLY runs up to 4 parallel subprocesses, not a single fork. The
      branch change to that file was to ADD a `@ts-expect-error` so poolOptions
      survives the vitest-4 typecheck — poolOptions was patched to keep working,
      not removed. The config's own top comment block is internally
      contradictory (says "singleFork: true ... ONE subprocess sequentially"
      while the live setting is singleFork:false/maxForks:4).
    evidence: |
      git diff main..develop -- packages/sdk/vitest.config.ts
        => only addition is `+ // @ts-expect-error ...` above `poolOptions: {`
      packages/sdk/vitest.config.ts:
        pool: "forks"
        poolOptions.forks.singleFork: false
        poolOptions.forks.maxForks: 4
        fileParallelism: false, maxConcurrency: 1
      The flakiness is real and pre-existing (native sqlite contention under
      multi-fork parallelism), but the WRITTEN diagnosis misattributes it.
    recommended_action: >
      Correct the validate report's root-cause sentence: the flakiness stems
      from intentional multi-fork parallelism (singleFork:false, maxForks:4)
      contending on better-sqlite3/sqlite-vec native bindings — NOT from
      poolOptions being removed. Also reconcile the contradictory comment block
      in packages/sdk/vitest.config.ts (top comment claims singleFork:true; live
      config is singleFork:false). Non-blocking: behavior is correct; the
      documentation/diagnosis is misleading.

  - id: F-tests-2
    severity: LOW
    file: .claude/knowledge-base/implementations/monorepo-cohesion-split-implementation.md
    line: 56
    plan_ref: "T3.1 — gateways extraction"
    summary: >
      Cosmetic count discrepancy already self-disclosed: plan prose said "11
      adapters / 12 packages"; actual is gateway core + 10 adapters = 11
      packages. Verified the extracted theokit-gateways repo has exactly 11
      package dirs (gateway + 10 adapters). The full gateway* set WAS captured;
      this is a label error in plan prose, honestly logged as a deviation.
    evidence: |
      ls -d theokit-gateways/packages/*/ => 11 dirs
      (gateway, gateway-{discord,email,line,matrix,mattermost,slack,sms,teams,telegram,whatsapp})
    recommended_action: "None required — already disclosed in the deviations section."

  - id: F-tests-3
    severity: INFO
    file: packages/sdk/tests
    line: 0
    plan_ref: "Agent def §6 — skipped tests are BLOCKER"
    summary: >
      No unconditional `.skip` / `it.only` / `xit` leaks were introduced by this
      branch. The only skip patterns in the test diff are env-gated
      `describe.skipIf(...)` blocks (real-LLM provider keys, chaos flags) — the
      documented pattern per rules/real-llm-validation.md, NOT a blocker.
    evidence: |
      git diff main..develop -- 'packages/sdk/tests/**' | grep '^+.*\.skip|\.only|xit'
        => all hits are `describe.skipIf(SKIP_CHAOS|env.shouldSkip)(...)`
    recommended_action: "None — env-gated conditional skips are legitimate."

