ls:
  packages/*/src:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  packages/*/src/**:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  packages/*/tests:
    .ts: regex:^[a-z][a-z0-9-]*$
  packages/*/tests/**:
    .ts: regex:^[a-z][a-z0-9-]*$
  # Root e2e suite. Named here rather than left out: a directory no gate is scoped to
  # is a directory whose conventions nobody checks, and this one holds the only tests
  # that consume the published package.
  e2e:
    .ts: regex:^[a-z][a-z0-9-.]*$

ignore:
  - node_modules
  - dist
  - dist-runtime
  - build
  - target
  - coverage
  - .git
  - .nvm
  - .pnpm-store
  - .changeset
  - .github
  - .claude.previous.bak
  - .claude
  - referencia
  - docs/evalscope
  - architecture-output
  - examples
