ls:
  packages/*/src:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  packages/*/src/**:
    .ts: regex:^[a-z][a-z0-9-]*$
    .tsx: regex:^[a-z][a-z0-9-]*$
  packages/*/tests:
    .ts: regex:^[a-z][a-z0-9-]*$
    # Compound extensions are declared explicitly because ls-lint matches on the
    # LONGEST extension: `foo.test.ts` has extension `.test.ts`, so the `.ts` rule
    # above never sees it. Measured 2026-09-01: 933 of the 951 .ts files under
    # packages/*/tests carry a compound extension, so the gate reported green over
    # 98.1% of the tree it appears to cover, and two real deviations were hiding in
    # the unchecked remainder. Any new compound extension must be added here or it
    # is silently unchecked.
    .test.ts: regex:^[a-z][a-z0-9-]*$
    .golden.test.ts: regex:^[a-z][a-z0-9-]*$
    .contract.test.ts: regex:^[a-z][a-z0-9-]*$
    .property.test.ts: regex:^[a-z][a-z0-9-]*$
    .e2e.test.ts: regex:^[a-z][a-z0-9-]*$
    .integration.test.ts: regex:^[a-z][a-z0-9-]*$
    .adversarial.test.ts: regex:^[a-z][a-z0-9-]*$
  packages/*/tests/**:
    .ts: regex:^[a-z][a-z0-9-]*$
    # Compound extensions are declared explicitly because ls-lint matches on the
    # LONGEST extension: `foo.test.ts` has extension `.test.ts`, so the `.ts` rule
    # above never sees it. Measured 2026-09-01: 933 of the 951 .ts files under
    # packages/*/tests carry a compound extension, so the gate reported green over
    # 98.1% of the tree it appears to cover, and two real deviations were hiding in
    # the unchecked remainder. Any new compound extension must be added here or it
    # is silently unchecked.
    .test.ts: regex:^[a-z][a-z0-9-]*$
    .golden.test.ts: regex:^[a-z][a-z0-9-]*$
    .contract.test.ts: regex:^[a-z][a-z0-9-]*$
    .property.test.ts: regex:^[a-z][a-z0-9-]*$
    .e2e.test.ts: regex:^[a-z][a-z0-9-]*$
    .integration.test.ts: regex:^[a-z][a-z0-9-]*$
    .adversarial.test.ts: regex:^[a-z][a-z0-9-]*$
  # Root e2e suite. Named here rather than left out: a directory no gate is scoped to
  # is a directory whose conventions nobody checks, and this one holds the only tests
  # that consume the published package.
  e2e:
    .ts: regex:^[a-z][a-z0-9-.]*$
    .config.ts: regex:^[a-z][a-z0-9-]*$
    .e2e.test.ts: regex:^[a-z][a-z0-9-]*$

ignore:
  - node_modules
  - dist
  - dist-runtime
  - build
  - target
  - coverage
  - .git
  - .nvm
  - .pnpm-store
  - .changeset
  - .github
  - .claude.previous.bak
  - .claude
  - referencia
  - docs/evalscope
  - architecture-output
  - examples
