# SonarCloud automatic analysis configuration.
#
# Analysis here runs through the GitHub App rather than a CI job, so this file is
# the only place its behaviour can be set. Without it SonarCloud had no idea which
# files are tests, and rated assertion style and fixture data as production defects
# — a "add at least one assertion to this test case" BLOCKER counts against the
# same reliability rating as a real bug in the SDK.
#
# Nothing here suppresses a finding in shipped code. It tells the analyser what
# each file IS.

sonar.sources=packages
sonar.tests=packages

# Test code, judged as test code. It still gets analysed; it stops driving the
# security and reliability ratings of the published library.
sonar.test.inclusions=\
  packages/*/tests/**/*, \
  packages/*/src/**/*.test.ts, \
  packages/*/src/**/*.test-d.ts, \
  packages/*/tests/**/*.mjs

# Excluded from analysis entirely, because none of it is authored source:
#   dist/       build output, re-derived on every build
#   fixtures/   input data for tests, deliberately malformed in places
#   templates/  scaffolding copied verbatim into a user's new project
#   *.d.ts      generated type declarations
sonar.exclusions=\
  **/dist/**, \
  **/node_modules/**, \
  **/coverage/**, \
  **/*.d.ts, \
  **/*.d.mts, \
  **/*.d.cts, \
  packages/*/tests/fixtures/**, \
  packages/sdk/templates/**, \
  packages/*/src/**/provider-catalog.json

# Coverage is measured by vitest against src, not against tests or fixtures.
sonar.coverage.exclusions=\
  packages/*/tests/**/*, \
  packages/sdk/templates/**, \
  **/*.config.ts

# Duplication in tests is usually the point: two tests that set up the same state
# to assert different behaviour should not be collapsed into a shared helper that
# hides what each one is proving.
sonar.cpd.exclusions=\
  packages/*/tests/**/*, \
  packages/*/src/**/*.test.ts
